[project]
name = "ttfchart"
version = "0.1.0"
description = "Generate a PDF glyph chart for a TrueType/OpenType font, grouped by Unicode block"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Moses O. Gold", email = "mosesogold@gmail.com" },
]
keywords = ["fonts", "ttf", "otf", "glyphs", "pdf", "unicode", "fontTools"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Fonts",
]
dependencies = [
    "fonttools>=4.0",
    "pillow>=10.0",
    "reportlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/iamontheweb/ttfchart"
Issues = "https://github.com/iamontheweb/ttfchart/issues"

[project.scripts]
ttfchart = "ttfchart:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Single-file script; ship it as a top-level module.
include = ["ttfchart.py"]
